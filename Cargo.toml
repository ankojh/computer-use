[workspace]
resolver = "2"
members = ["crates/cu-core", "crates/cu-providers", "crates/cu-mac-sys", "crates/cu-mac", "crates/cu-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
cu-core = { path = "crates/cu-core" }
cu-providers = { path = "crates/cu-providers" }
cu-mac-sys = { path = "crates/cu-mac-sys" }
cu-mac = { path = "crates/cu-mac" }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "process", "io-util"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
tokio-util = "0.7"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "gzip", "http2"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
proptest = "1"
